title: SilenceDiors 的博客
description: 个人博客，用来记录与分享学习过程。
author: SilenceDiors
url: "https://silencediors.github.io"
baseurl: ""

# Jekyll 主题
theme: minima

# 插件
plugins:
  - jekyll-feed
  - jekyll-sitemap

# 社交链接（可选）
# twitter_username: your_twitter
# github_username: SilenceDiors

# 构建设置
markdown: kramdown
highlighter: rouge

# 排除文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .gitignore
  - README.md

