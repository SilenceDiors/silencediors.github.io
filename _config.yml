title: "陈栋梁 (Silen Chen) — 网络安全研究"
tagline: "陈栋梁 / Silen Chen / SilenceDiors · 应用安全研究 · Apple Security Acknowledgements"
description: >-
  陈栋梁(Silen Chen / SilenceDiors)的个人博客,记录网络安全方向的研究与思考,
  关注应用安全、AI 安全、Web3 安全。2026 年 2 月获 Apple Web Server Security
  Acknowledgements 官方致谢。

author: "Silen Chen (陈栋梁)"

url: "https://silencediors.github.io"
baseurl: ""

lang: "zh-CN"
locale: "zh_CN"

theme: minima

header_pages:
  - about.md

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

github_username: SilenceDiors

social:
  name: "Silen Chen"
  links:
    - https://github.com/SilenceDiors
    - https://support.apple.com/en-us/102774

# 让 kramdown 解析块级 HTML 元素里的 markdown
kramdown:
  input: GFM
  parse_block_html: true

highlighter: rouge
permalink: /:year/:month/:day/:title/

show_excerpts: false

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .gitignore
  - README.md
  - deploy.sh
  - setup.sh
